name: Edit published uNews post
on:
  push:
    branches: [main]
    paths:
      - ".github/unews-edit-request.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unews-edit-published-post
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout uNews
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test source and policy
        run: npm test
      - name: Verify Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
        run: npm run diagnose:telegram
      - name: Repair published post
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npm run repair:published
      - name: Commit repair state
        run: |
          if git diff --quiet -- data/published.json; then
            echo "No published state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Record edited uNews published post"
          git push
