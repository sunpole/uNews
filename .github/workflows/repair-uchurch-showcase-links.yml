name: Add uChurch showcase links
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only; do not edit Telegram posts"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: unews-publish-all-news
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test
        run: npm test
      - name: Preview targets
        run: node scripts/repair-uchurch-showcase-links.js
      - name: Update existing posts
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/repair-uchurch-showcase-links.js --apply
      - name: Preserve completed updates even after partial failure
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/published.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Record uChurch showcase link updates"
          git pull --rebase origin main
          git push
